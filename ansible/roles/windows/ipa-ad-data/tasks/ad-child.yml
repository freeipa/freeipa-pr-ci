- name: subdomaintestgroup
  win_domain_group:
    name: subdomaintestgroup
    scope: global
    attributes:
      gidNumber: 10147

- name: A test user with posix attributes defined
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subdomaintestuser
      GivenName: Subdomaintest
      Surname: User
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      Enabled: $true
      OtherAttributes: "@{'uidNumber'='10142'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/subdomaintestuser'; 'gecos'='Subdomaintest User'}"

- name: A test user2 with posix attributes defined
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subdomaintestuser2
      GivenName: Subdomaintest2
      Surname: User2
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      Enabled: $true
      OtherAttributes: "@{'uidNumber'='10144'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/subdomaintestuser2'; 'gecos'='Subdomaintest User2'}"

- name: set Subdomaintest User primary group
  include_role:
    name: windows/ipa-ad-data
    tasks_from: primary_group.yml
  vars:
    user: subdomaintestuser
    group: subdomaintestgroup

- name: A test user with posix attributes which is disabled
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subdomaindisabledadu
      UserPrincipalName: subdomaindisabledaduser@{{ ad_child_domain }}
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      Enabled: $false
      OtherAttributes: "@{'uidNumber'='10143'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/subdomaindisableduser'}"

- name: A test user1 without posix attributes defined
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subnonposixuser1
      GivenName: subNonposix1
      Surname: subUser1
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      Enabled: $true

- name: A test subnonposixuser2 without posix attributes defined
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subnonposixuser2
      GivenName: subNonposix2
      Surname: subUser2
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      Enabled: $true

- name: A test user with expired AD account (accountExpires in the past)
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subexpiredaduser
      GivenName: subexpiredaduser
      Surname: User
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      AccountExpirationDate: (Get-Date).AddDays(-1)
      Enabled: $true
      OtherAttributes: "@{'uidNumber'='10149'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/subexpiredaduser'; 'unixHomeDirectory'='/home/subexpiredaduser'; 'gecos'='Expired AD User'}"

- name: AD child user with CannotChangePassword
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: subcantchgpwduser
      GivenName: SubCannotChangePwd
      Surname: User
      AccountPassword: Secret123
      PasswordNeverExpires: $true
      CannotChangePassword: $true
      Enabled: $true
      OtherAttributes: "@{'uidNumber'='10150'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/subcantchgpwduser'; 'unixHomeDirectory'='/home/subcantchgpwduser'; 'gecos'='Sub Cannot Change Password User'}"

- name: AD child user with ChangePasswordAtLogon (must change password at next logon)
  include_role:
    name: windows/ipa-ad-data
    tasks_from: user.yml
  vars:
    options:
      Name: submustchgpwduser
      GivenName: SubChangePwdAtLogon
      Surname: User
      AccountPassword: Secret123
      ChangePasswordAtLogon: $true
      PasswordNeverExpires: $false
      Enabled: $true
      OtherAttributes: "@{'uidNumber'='10151'; 'gidNumber'='10147'; 'loginShell'='/bin/sh'; 'homeDirectory'='/home/submustchgpwduser'; 'unixHomeDirectory'='/home/submustchgpwduser'; 'gecos'='Sub Change Password At Logon User'}"
